name: Generate Builder Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # Update otomatis tiap tengah malam
  workflow_dispatch:    # Bisa dijalankan manual kapan saja

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Generate Snake Animation
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FAHMIALAN
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F59E0B

      # 2. Generate 3D Contribution Graph
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: FAHMIALAN

      # 3. Generate Profile Summary Cards (Area Chart & Donut Chart)
      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: FAHMIALAN

      # 4. Push semua hasil gambar ke repo
      - name: Commit & Push generated assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "🚧 Update builder profile stats & animations" || exit 0
          git push
